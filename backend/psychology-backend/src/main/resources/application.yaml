server:
  port: 8080
  error:
    include-message: always
    include-exception: true

logging:
  level:
    com.psychology: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.client: DEBUG

spring:
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  web:
    resources:
      cache:
        period: 0
      static-locations: classpath:/static/
  datasource:
    url: jdbc:mysql://localhost:3306/psychology_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}

xf:
  appid: ${XF_APPID:}
  apiSecret: ${XF_API_SECRET:}
  apiKey: ${XF_API_KEY:}
  hostUrl: wss://spark-api.xf-yun.com/v4.0/chat   # Ultra-32K 使用 v4.0 地址

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 提供至少 32 字节的密钥
  secret: ${JWT_SECRET:}
